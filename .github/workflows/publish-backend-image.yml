name: Publish backend image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - backend/**
      - .github/workflows/publish-backend-image.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/publish-backend-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish)) && ' and publish' || '' }}
    runs-on: ubuntu-latest
    env:
      PUBLISH_IMAGE: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate publish configuration
        if: env.PUBLISH_IMAGE == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable before publishing."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set the DOCKERHUB_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PUBLISH_IMAGE == 'true' && (vars.DOCKERHUB_IMAGE || format('{0}/equora-backend', vars.DOCKERHUB_USERNAME)) || 'equora-backend' }}
          flavor: latest=false
          tags: |
            type=raw,value=ci,enable=${{ env.PUBLISH_IMAGE != 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ env.PUBLISH_IMAGE == 'true' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=equora-backend
          cache-to: type=gha,mode=max,scope=equora-backend
