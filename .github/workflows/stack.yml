name: Stack checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - run: uv run ruff check . ../scripts/export_openapi.py
      - run: uv run ruff format --check . ../scripts/export_openapi.py
      - run: uv run pytest
      - name: Check OpenAPI schema
        run: |
          uv run python ../scripts/export_openapi.py
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file requirements.lock
          git diff --exit-code -- openapi.json requirements.lock
      - name: Validate Compose
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.18.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:api
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:e2e
