name: Stack checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: equora_test
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: equora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equora_test -d equora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://equora_test:ci-disposable-password@127.0.0.1:5432/equora_test
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - run: uv run ruff check . ../scripts/export_openapi.py ../scripts/test_postgres.py
      - run: uv run ruff format --check . ../scripts/export_openapi.py ../scripts/test_postgres.py
      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Save backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/
          if-no-files-found: warn
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: backend/coverage/coverage.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: true
      - name: Check OpenAPI schema
        run: |
          uv run python ../scripts/export_openapi.py
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file requirements.lock
          git diff --exit-code -- openapi.json requirements.lock
      - name: Validate Compose
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.18.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:api
      - run: pnpm run check
      - name: Test with coverage
        run: pnpm run test:coverage
      - name: Save frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          if-no-files-found: warn
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: true
      - run: pnpm run build
      - run: pnpm run test:e2e
