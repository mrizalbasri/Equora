name: Keep backend awake

# Render/Railway free tier spins the backend down after inactivity.
# Ping through the Vercel proxy every 10 minutes so judges never hit a
# cold start. Disable/delete this workflow after the competition.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 \
              https://equora-tau.vercel.app/api/v1/health/ready)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::Backend health ping failed 3 times; backend may have been scaled down or is unreachable."
