# Template only. Put an HTTPS reverse proxy in front of the loopback web port.
# Run with --env-file <private-env-path>; never commit real credentials.
name: equora-production
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the private PostgreSQL URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set the admin token}
      CORS_ORIGINS: '["${PUBLIC_ORIGIN:?Set the HTTPS public origin}"]'
      DATA_DIR: /data
      REQUIRE_PUBLISHED_DATA: "true"
      WRITE_REQUESTS_PER_MINUTE: ${WRITE_REQUESTS_PER_MINUTE:-60}
      MAX_SAVED_SCENARIOS: ${MAX_SAVED_SCENARIOS:-10000}
    volumes:
      - ${EQUORA_DATA_DIR:?Set the approved data directory}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 8s
      retries: 3
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS public origin}
      BODY_SIZE_LIMIT: 64K
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
