[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equora-backend"
version = "0.1.0"
description = "API and data processing foundation for Equora"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "polars>=1,<2",
  "openpyxl>=3.1,<4",
  "ortools>=9.15,<10",
  "reportlab>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "uv>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.html]
directory = "coverage/html"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
